# Luna2 REST API - Configuration
spring.application.name=Luna2 REST API
server.port=8081
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/luna2?useSSL=false&serverTimezone=UTC
spring.datasource.username=luna2_user
spring.datasource.password=luna2_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.root=INFO
logging.level.it.zensoftware.luna2=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security (CORS per dashboard client)
# TODO: Configurare CORS specificamente in SecurityConfig

# WebSocket
spring.websocket.allowed-origins=*

# OpenAPI/Swagger
springdoc.swagger-ui.path=/api-docs
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operations-sorter=method

# Calendar Sync
calendar.encryption.secret=DefaultCalendarSecretKey2026
calendar.sync.interval-minutes=30

# JWT
jwt.secret=ChangeThisSecretInProduction
jwt.exp-minutes=60
jwt.issuer=luna2-api

# API Rate Limiting (TODO)
# api.rate-limit.enabled=true
