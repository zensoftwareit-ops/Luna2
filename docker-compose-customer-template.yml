# Docker Compose per SINGLE CUSTOMER INSTANCE
# Template per cliente: sostituire %%DOMAIN%% e %%CUSTOMER_NAME%% con valori reali
# Esempio: docker-compose -f docker-compose-customer-acme.com.yml up -d

services:
  # Database MySQL per questo cliente
  mysql-%%DOMAIN%%:
    image: mysql:8.0
    container_name: mysql-%%DOMAIN%%
    environment:
      MYSQL_ROOT_PASSWORD: %%MYSQL_ROOT_PASSWORD%%
      MYSQL_DATABASE: luna2
      MYSQL_USER: luna2_user
      MYSQL_PASSWORD: %%MYSQL_USER_PASSWORD%%
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "%%MYSQL_PORT%%:3306"  # Porta univoca per cliente
    volumes:
      - ./data/mysql-%%DOMAIN%%:/var/lib/mysql
      - ./database/luna2-complete-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - network-%%DOMAIN%%
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "luna2_user", "-p%%MYSQL_USER_PASSWORD%%"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      client: %%CUSTOMER_NAME%%
      domain: %%DOMAIN%%
      service: database

  # Luna2 Application per questo cliente
  luna2-%%DOMAIN%%:
    build:
      context: .
      dockerfile: luna2-api/Dockerfile
    container_name: luna2-%%DOMAIN%%
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-%%DOMAIN%%:3306/luna2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: luna2_user
      SPRING_DATASOURCE_PASSWORD: %%MYSQL_USER_PASSWORD%%
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: false
      JAVA_OPTS: -Xmx1024m -Xms512m
      SERVER_SERVLET_CONTEXT_PATH: /
      SERVER_PORT: 8080
      TZ: Europe/Rome
      # OAuth Google (opzionale)
      OAUTH_GOOGLE_CLIENT_ID: %%OAUTH_GOOGLE_CLIENT_ID%%
      OAUTH_GOOGLE_CLIENT_SECRET: %%OAUTH_GOOGLE_CLIENT_SECRET%%
      OAUTH_REDIRECT_URI: https://%%DOMAIN%%/auth/google/callback
      # Cliente-specific
      CUSTOMER_NAME: %%CUSTOMER_NAME%%
      CUSTOMER_DOMAIN: %%DOMAIN%%
    ports:
      - "%%APP_PORT%%:8080"  # Porta univoca per cliente
    depends_on:
      mysql-%%DOMAIN%%:
        condition: service_healthy
    networks:
      - network-%%DOMAIN%%
    volumes:
      - ./logs/luna2-%%DOMAIN%%:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      client: %%CUSTOMER_NAME%%
      domain: %%DOMAIN%%
      service: application

  # PhpMyAdmin per gestire il DB di questo cliente
  phpmyadmin-%%DOMAIN%%:
    image: phpmyadmin:5.2-apache
    container_name: phpmyadmin-%%DOMAIN%%
    environment:
      PMA_HOST: mysql-%%DOMAIN%%
      PMA_USER: luna2_user
      PMA_PASSWORD: %%MYSQL_USER_PASSWORD%%
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: %%MYSQL_ROOT_PASSWORD%%
      UPLOAD_LIMIT: 300M
      # Security
      PMA_ABSOLUTE_URI: https://phpmyadmin.%%DOMAIN%%/
      MAX_EXECUTION_TIME: 600
      MEMORY_LIMIT: 512M
    ports:
      - "%%PHPMYADMIN_PORT%%:80"  # Porta univoca per cliente
    depends_on:
      mysql-%%DOMAIN%%:
        condition: service_healthy
    networks:
      - network-%%DOMAIN%%
    volumes:
      - ./data/phpmyadmin-%%DOMAIN%%:/var/lib/phpmyadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      client: %%CUSTOMER_NAME%%
      domain: %%DOMAIN%%
      service: database-ui

networks:
  network-%%DOMAIN%%:
    driver: bridge
    name: network-%%DOMAIN%%

volumes:
  mysql-%%DOMAIN%%:
  phpmyadmin-%%DOMAIN%%:

# Note:
# - Ogni cliente ha RETE ISOLATA (network-%%DOMAIN%%)
# - Porte MySQL, App, PhpMyAdmin sono UNIVOCHE per cliente (assegnate da manage-domains.sh)
# - Volumi persistenti per DB e logs
# - Health checks configurati per startup robusto
# - Labels per tracking ownership (client, domain, service)
# - Security: no-new-privileges su container
# - PhpMyAdmin accessible via https://phpmyadmin.%%DOMAIN%% (via Nginx proxy)
